<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sangre Carbayona - Puzzle de Flechas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- Menú Principal -->
        <div id="menu-screen">
            <h1>⚽ Sangre Carbayona</h1>
            <p>Puzzle de Flechas</p>
            <button id="start-btn">Comenzar</button>
        </div>

        <!-- Pantalla de Juego -->
        <div id="game-screen" style="display:none;">
            <div id="hud">
                <span id="level-display">Nivel 1</span>
                <span id="hearts-display">❤️ ❤️ ❤️</span>
            </div>
            <div id="board-container">
                <canvas id="gameCanvas" width="400" height="400"></canvas>
            </div>
            <div id="controls">
                <button id="hint-btn">💡 Pista</button>
                <button id="reset-btn">🔄 Reiniciar Nivel</button>
            </div>
        </div>

        <!-- Pantalla de Nivel Completado -->
        <div id="level-complete" style="display:none;">
            <h2>¡Nivel Completado!</h2>
            <div id="player-info">
                <img src="" alt="Jugador" id="player-img">
                <p id="player-name"></p>
            </div>
            <div id="level-stats">
                <p>Nivel: <span id="completed-level">1</span></p>
            </div>
            <button id="next-level-btn">Siguiente Nivel</button>
            <button id="exit-btn">Salir</button>
        </div>
    </div>

    <script src="js/levels.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
